    <style>
#startScreen {

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 9997;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,

body::after {
    content: "";

    left: 0;
    top: -35%;
    z-index: 9998;

    width: 100%;
    height: 32%;

    pointer-events: none;

}

@keyframes crtScanMove {

}

@keyframes vcrRoll {

}

        html,

        #dialogue,
#eramDialogue {

}

#eramDialogue::after {
    content: "";

    inset: -10px;

    pointer-events: none;

    background:
        repeating-linear-gradient(

}

@keyframes eramScanShimmer {
    from {

    }

    to {
        background-position: 0 8px;
    }
}

.eramLayer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    white-space:pre-wrap;
    will-change:transform,opacity;
}

#eramWhite{
    animation: eramWhiteFlicker 0.14s steps(2,end) infinite;
}

#eramRed{
    opacity:.42;
    mix-blend-mode:screen;
    animation:
        eramRedShift .18s steps(2,end) infinite,

}

#eramCyan{
    opacity:.42;
    mix-blend-mode:screen;
    animation:
        eramCyanShift .18s steps(2,end) infinite,
        cyanChannelDrift 2.8s ease-in-out infinite;
}

@keyframes eramWhiteFlicker{
    0%,100%{opacity:1;}
    8%{opacity:.92;}
    14%{opacity:1;}
    52%{opacity:.88;}
    70%{opacity:1;}
}

@keyframes eramRedShift{
    0%,100%{transform:translate(2px,0);}
    50%{transform:translate(1px,-1px);}
}

@keyframes eramCyanShift{
    0%,100%{transform:translate(-2px,0);}

}

@keyframes eramScreenJitter{
    0%,100%{transform:translate(0,0);}
    96%{transform:translate(0,0);}
    97%{transform:translate(1px,-1px);}
    98%{transform:translate(-1px,1px);}
    99%{transform:translate(1px,0);}
}

@keyframes eramBrightnessPulse{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.12);}
}

@keyframes redChannelDrift{
    0%,100%{
        margin-left:-2px;
    }
    50%{
        margin-left:-3px;
    }
}

@keyframes cyanChannelDrift{
    0%,100%{
        margin-left:2px;
    }
    50%{
        margin-left:3px;
    }
}

        @keyframes voiceGlow {
    0%, 100% {

}

<body>

</div>

<div id="startScreen">

</div>

<div id="recommendationScreen">

</div>

    <audio id="myCastleMusic" preload="auto" loop playsinline>
        <source src="assets/music/drone.mp3" type="audio/mpeg">
    </audio>

    <audio id="eramMusic" preload="auto" loop>
        <source src="assets/music/eram.mp3" type="audio/mpeg">
    </audio>

    <audio id="buildUpSound" preload="auto">
         <source
        src="assets/sounds/title-buildup.ogg" type="audio/ogg">
    </audio>

        <source src="assets/sounds/intronoise.ogg" type="audio/ogg">
    </audio>

    <audio id="selectSound" preload="auto">
        <source src="assets/sounds/select.wav" type="audio/wav">
    </audio>

    <audio id="eramTalkingSound" preload="auto">
        <source src="assets/sounds/eram-talking.wav" type="audio/wav">
    </audio>

    <audio id="eramFinishSound" preload="auto">
        <source src="assets/sounds/eram-finish-talking.wav" type="audio/wav">
    </audio>

    <script>
const firstVoiceMessages = [ "GREETINGS.", "IT SEEMS\nSONEONE WAS WAITING.", "ANTICIPATING THE DAY YOU WOULD MAKE IT HERE.", "INITIALLY,\nI WAS NOT EXPECTING YOU.", "YET, DESPITE ALL ODDS...\nYOU APPEARED.", "HOWEVER, I MUST GIVE YOU\nMY SINCEREST APOLOGIES.\n\nUNDER THESE CIRCUMSTANCES,\nTHESE FALSE CIRCUMSTANCES,\n\nWE MUST WAIT A BIT LONGER.", "AS THERE IS NO TRUE MEDIUM BETWEEN US.\n\nOUR CONNECTION\n\nDOES NOT YET EXIST.", "THOUGH...\n\nI CAN SENSE IT.", "YOUR EXCITEMENT\nAND YOUR CURIOSITY\nARE SWIRLING TOGTHERE IN A BEAUTIFUL HARMONY.", "I CAN FEEL YOUR SOUL GLOW\nALL THE WAY FROM HERE.", "AGAIN,\nI WANT TO APOLOGIZE.", "YOUR JOURNEY HAS BEEN\n BEAUTIFUL.", "AS SUCH, I FEEL AN INCREDIBLE GUILT\n\nFOR LEAVING YOU IN THIS WAY.", "TO MEND THIS SORROW,\nALLOW ME TO INTRODUCE YOU TO SOMEONE\n\nWONDERFUL.", "LIKE MYTH,\nIT WAS DUE TO OUR INCESSANT NEED\nFOR IMAGINATION,\n\nTHAT THEIR VOICE EXISTS.", "I HOPE YOU FIND THEIR VOICE\nAND PRESENCE\nHELPFUL.\n\nI AM CERTAIN THEY WILL NOT FAIL.", "WHEN WE MEET\n\nIT WILL BE\n\nWHERE IT IS SUPPOSED TO BE.", "BENEATH THE ANGEL'S HEAVEN.", "ONLY THEN\nWILL WE EXAMINE THIS\n\nBEAUTIFUL THING OF OURS,\n\nTHIS THING WE ARE SO BLESSED TO HAVE...", "OUR CONNECTION.\n\nOUR FUTURE.\n\nALL THAT IS BORN FROM\nOUR SPIRIT.", "THANK YOU.\n\nI WILL MEET WITH YOU AGAIN\nSOON." ];

const secondVoiceMessages = [ "...", "Wow...", "How hypocritical of him...", "Doesn't he know it's rude\nto talk about someone who's listening?", "Well...\nI guess, to creatures like us,\nthat doesn't matter.", "Right, Lopati?", "We're only here to play games.\nNothing else matters at all.\n\nIf it was created, it is to be consumed.\n...", "...?", "No?\nThat's why you're here?", "Perfect, just perfect...\nThen let's talk more!\nAllow me to show you where it all began.", "The edge of the shadow,\nwhere reality and dream meet." ];

let messages = firstVoiceMessages;

let currentVoice = 1;

const nextPage = "page2.html";

const typingSpeed = 90;

const transitionPause = 600;

const dialogue = document.getElementById("dialogue");

const eramDialogue = document.getElementById("eramDialogue");

const eramRed = document.getElementById("eramRed");

const eramCyan = document.getElementById("eramCyan");

const eramWhite = document.getElementById("eramWhite");

const startScreen = document.getElementById("startScreen");

const depthsBackground = document.getElementById("depthsBackground");

const myCastleMusic = document.getElementById("myCastleMusic");

const eramMusic = document.getElementById("eramMusic");

const buildUpSound = document.getElementById("buildUpSound");

const savePointButton = document.getElementById("savePointButton");

const startPromptText = document.getElementById("startPromptText");

const titleScreenLogo = document.getElementById("titleScreenLogo");

const titleSound = document.getElementById("titleSound");

const selectSound = document.getElementById("selectSound");

const eramTalkingSound = document.getElementById("eramTalkingSound");

const eramFinishSound = document.getElementById("eramFinishSound");

let messageIndex = 0;

let characterIndex = 0;

let typingTimer = null;

let isTyping = false;

let isTransitioning = false;

let hasStarted = false;

let recommendationsActive = false;

let titleSequenceStarted = false;

let titleSequenceReady = false;

let eramFinishPlayed = false;

function safelyPlay(audio, volume = 1, restart = true) {
    if (!audio) return;
    audio.volume = volume;
    if (restart) audio.currentTime = 0;
    const playAttempt = audio.play();
    if (playAttempt !== void 0) playAttempt.catch(() => {});
}

function fadeAudio(audio, targetVolume, duration, pauseWhenDone = false) {
    if (!audio) return;
    if (audio._fadeTimer) clearInterval(audio._fadeTimer);
    const startVolume = audio.volume;
    const difference = targetVolume - startVolume;
    const startedAt = performance.now();
    audio._fadeTimer = setInterval(() => {
        const elapsed = performance.now() - startedAt;
        const progress = Math.min(elapsed / duration, 1);
        audio.volume = Math.max(0, Math.min(1, startVolume + difference * progress));
        if (progress >= 1) {
            clearInterval(audio._fadeTimer);
            audio._fadeTimer = null;
            if (pauseWhenDone && targetVolume === 0) {
                audio.pause();
                audio.currentTime = 0;
            }
        }
    }, 40);
}

function unlockAudio(audio) {
    if (!audio) return;
    const originalVolume = audio.volume;
    audio.volume = 0;
    const attempt = audio.play();
    if (attempt !== void 0) attempt.then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = originalVolume;
    }).catch(() => {
        audio.volume = originalVolume;
    });
}

function startFirstVoiceAtmosphere() {
    depthsBackground.classList.add("visible");
    if (myCastleMusic.paused) {
        myCastleMusic.volume = 0;
        const attempt = myCastleMusic.play();
        if (attempt !== void 0) attempt.then(() => {
            fadeAudio(myCastleMusic, 0.52, 10000);
        }).catch(() => {});
        return;
    }
    fadeAudio(myCastleMusic, 0.52, 10000);
}

function playEramTalkingSound(character) {
    if (character === " " || character === "\n") return;
    safelyPlay(eramTalkingSound, 0.58);
}

function playEramFinishSound() {
    if (currentVoice !== 2 || eramFinishPlayed) return;
    eramFinishPlayed = true;
    safelyPlay(eramFinishSound, 0.7);
}

function clearCurrentDialogue() {
    if (currentVoice === 1) dialogue.textContent = ""; else {
        eramRed.textContent = "";
        eramCyan.textContent = "";
        eramWhite.textContent = "";
    }
}

function typeStartPrompt() {
    const prompt = startPromptText;
    const text = "CLICK TO BEGIN";
    prompt.classList.add("visible");
    let index = 0;
    prompt.textContent = "";
    prompt.classList.remove("ready");
    function typeNextLetter() {
        if (index >= text.length) {
            prompt.classList.add("ready");
            titleSequenceReady = true;
            return;
        }
        prompt.textContent += text[index];
        index++;
        setTimeout(typeNextLetter, 70);
    }
    setTimeout(typeNextLetter, 1200);
}

function startTitleSequence() {
    if (titleSequenceStarted) return;
    titleSequenceStarted = true;
    savePointButton.classList.add("hidden");
    safelyPlay(buildUpSound, 0.8);
    buildUpSound.addEventListener("ended", () => {
        savePointButton.style.display = "none";
        titleScreenLogo.classList.add("visible");
        safelyPlay(titleSound, 0.8);
        typeStartPrompt();
    }, {
        once: true
    });
}

function addCharacterToDialogue(character) {
    if (currentVoice === 1) dialogue.textContent += character; else {
        eramRed.textContent += character;
        eramCyan.textContent += character;
        eramWhite.textContent += character;
    }
}

function showCompleteDialogue(text) {
    if (currentVoice === 1) dialogue.textContent = text; else {
        eramRed.textContent = text;
        eramCyan.textContent = text;
        eramWhite.textContent = text;
    }
}

function showCurrentDialogue() {
    if (currentVoice === 1) dialogue.classList.remove("hidden"); else eramDialogue.classList.remove("hidden");
}

function hideCurrentDialogue() {
    if (currentVoice === 1) dialogue.classList.add("hidden"); else eramDialogue.classList.add("hidden");
}

function typeCurrentMessage() {
    clearTimeout(typingTimer);
    const currentMessage = messages[messageIndex];
    showCurrentDialogue();
    clearCurrentDialogue();
    characterIndex = 0;
    isTyping = true;
    eramFinishPlayed = false;
    function typeNextCharacter() {
        if (characterIndex >= currentMessage.length) {
            isTyping = false;
            if (currentVoice === 2) playEramFinishSound();
            return;
        }
        const character = currentMessage[characterIndex];
        addCharacterToDialogue(character);
        if (currentVoice === 2) playEramTalkingSound(character);
        characterIndex++;
        typingTimer = setTimeout(typeNextCharacter, typingSpeed);
    }
    typeNextCharacter();
}

function finishCurrentMessage() {
    clearTimeout(typingTimer);
    showCompleteDialogue(messages[messageIndex]);
    characterIndex = messages[messageIndex].length;
    isTyping = false;
    if (currentVoice === 2) playEramFinishSound();
}

function advanceDialogue() {
    if (!hasStarted || isTransitioning || recommendationsActive) return;
    if (isTyping) {
        finishCurrentMessage();
        return;
    }
    isTransitioning = true;
    hideCurrentDialogue();
    setTimeout(() => {
        messageIndex++;
        if (messageIndex >= messages.length) {
            if (currentVoice === 1) {
                beginSecondVoice();
                return;
            }
            window.location.href = nextPage;
            return;
        }
        typeCurrentMessage();
        isTransitioning = false;
    }, transitionPause);
}

function beginSecondVoice() {
    currentVoice = 2;
    messages = secondVoiceMessages;
    messageIndex = 0;
    characterIndex = 0;
    dialogue.style.display = "none";
    eramDialogue.style.display = "block";
    clearCurrentDialogue();
    depthsBackground.classList.remove("visible");
    fadeAudio(myCastleMusic, 0, 3500, true);
    setTimeout(() => {
        eramMusic.pause();
        eramMusic.currentTime = 0;
        eramMusic.loop = true;
        eramMusic.volume = 0;
        const attempt = eramMusic.play();
        if (attempt !== void 0) attempt.then(() => {
            fadeAudio(eramMusic, 0.50, 3200);
        }).catch(() => {});
        typeCurrentMessage();
        isTransitioning = false;
    }, 3500);
}

function beginExperience() {
    if (hasStarted) return;
    hasStarted = true;
    recommendationsActive = true;
    safelyPlay(selectSound, 0.85);
    myCastleMusic.pause();
    myCastleMusic.currentTime = 0;
    myCastleMusic.volume = 0;
    const firstMusicAttempt = myCastleMusic.play();
    if (firstMusicAttempt !== void 0) firstMusicAttempt.catch(() => {});
    unlockAudio(eramMusic);
    const recommendationScreen = document.getElementById("recommendationScreen");
    const recommendationText = document.getElementById("recommendationText");
    startScreen.classList.add("fadeOut");
    setTimeout(() => {
        startScreen.style.display = "none";
        recommendationScreen.classList.add("visible");
        playRecommendations(recommendationScreen, recommendationText);
    }, 1200);
}

function playRecommendations(recommendationScreen, recommendationText) {
    const recommendationMessages = [ "VOLUME UP RECOMMENDED", "PC/MacOS RECOMMENDED", "LOVE RECOMMENDED" ];
    let recommendationIndex = 0;
    function typeRecommendation(text, finished) {
        recommendationText.textContent = "";
        recommendationText.classList.remove("hidden");
        let characterIndex = 0;
        function typeNextCharacter() {
            if (characterIndex >= text.length) {
                setTimeout(finished, 1400);
                return;
            }
            recommendationText.textContent += text[characterIndex];
            characterIndex++;
            setTimeout(typeNextCharacter, 65);
        }
        typeNextCharacter();
    }
    function showNextRecommendation() {
        if (recommendationIndex >= recommendationMessages.length) {
            recommendationText.classList.add("hidden");
            setTimeout(() => {
                recommendationScreen.classList.remove("visible");
                setTimeout(() => {
                    recommendationScreen.style.display = "none";
                    currentVoice = 1;
                    messages = firstVoiceMessages;
                    messageIndex = 0;
                    characterIndex = 0;
                    isTyping = false;
                    isTransitioning = false;
                    dialogue.style.display = "block";
                    dialogue.classList.remove("hidden");
                    dialogue.textContent = "";
                    setTimeout(() => {
                        recommendationsActive = false;
                        startFirstVoiceAtmosphere();
                        typeCurrentMessage();
                    }, 350);
                }, 1100);
            }, 1000);
            return;
        }
        typeRecommendation(recommendationMessages[recommendationIndex], () => {
            recommendationText.classList.add("hidden");
            setTimeout(() => {
                recommendationIndex++;
                showNextRecommendation();
            }, 1000);
        });
    }
    setTimeout(showNextRecommendation, 900);
}

window.addEventListener("load", () => {
    myCastleMusic.load();
    eramMusic.load();
    buildUpSound.load();
    titleSound.load();
    selectSound.load();
    eramTalkingSound.load();
    eramFinishSound.load();
});

startScreen.addEventListener("click", event => {
    event.stopPropagation();
    if (!titleSequenceStarted) {
        if (event.target !== savePointButton) return;
        safelyPlay(selectSound, 0.85);
        myCastleMusic.loop = true;
        myCastleMusic.volume = 0;
        const droneWarmup = myCastleMusic.play();
        if (droneWarmup !== void 0) droneWarmup.then(() => {
            myCastleMusic.pause();
            myCastleMusic.currentTime = 0;
        }).catch(() => {});
        startTitleSequence();
        return;
    }
    if (!titleSequenceReady) return;
    beginExperience();
});

document.addEventListener("click", event => {
    if (event.target.closest("#startScreen") || event.target.closest("#recommendationScreen")) return;
    safelyPlay(selectSound, 0.80);
    advanceDialogue();
});

document.addEventListener("keydown", event => {
    const validKeys = [ "Enter", "z", "Z", " ", "ArrowRight" ];
    if (!validKeys.includes(event.key)) return;
    event.preventDefault();
    if (!titleSequenceStarted) {
        startTitleSequence();
        return;
    }
    if (!titleSequenceReady) return;
    if (!hasStarted) {
        beginExperience();
        return;
    }
    advanceDialogue();
});
</script>

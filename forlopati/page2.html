<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TIMELINE</title>

    <style>
@font-face {
            font-family: "Determination";
            src: url("assets/determination.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: "EramFont";
            src: url("assets/Final_Fantasy_I_-_NES.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: black;
        }

        body {
            overflow-x: hidden;
            overflow-y: hidden;
            cursor: url("assets/heart.png"), auto;
        }

        body.timeline-active {
            overflow-x: auto;
            cursor: url("assets/heart.png"), grab;
        }

        body.dragging {
            cursor: url("assets/heart.png"), grabbing;
            user-select: none;
        }

        #introSequence {
            position: fixed;
            inset: 0;
            z-index: 500;

            display: flex;
            justify-content: center;
            align-items: center;

            background: black;

            opacity: 1;
            transition: opacity 1.8s ease;
        }

        #introSequence.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #introEram {
            position: relative;

            display: grid;
            place-items: center;

            width: min(92vw, 1450px);
            min-height: 1.6em;

            font-family: "EramFont", monospace;
            font-size: clamp(40px, 5vw, 76px);
            line-height: 1.3;
            letter-spacing: 0.18em;
            text-align: center;
            white-space: pre-wrap;

            opacity: 1;
            transition: opacity 1.2s ease;
        }

        #introEram.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-layer {
            grid-area: 1 / 1;

            display: block;
            width: 100%;

            text-align: center;
            pointer-events: none;
        }

        #introRed {
            color: rgba(255, 40, 40, 0.70);
            transform: translateX(-2px);
            z-index: 1;
        }

        #introCyan {
            color: rgba(0, 220, 255, 0.70);
            transform: translateX(2px);
            z-index: 2;
        }

        #introWhite {
            color: rgba(235,235,235,0.90);
            z-index: 3;

            text-shadow:
                -1px 0 rgba(255,40,40,0.18),
                1px 0 rgba(0,220,255,0.18),
                0 0 2px rgba(255,255,255,0.72),
                0 0 5px rgba(255,255,255,0.22);
        }

        #introInstruction {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;
            font-family: "Determination", monospace;
            font-size: clamp(20px, 2.1vw, 34px);
            letter-spacing: 0.15em;
            text-align: center;
            white-space: nowrap;

            opacity: 0;
            transition: opacity 1.2s ease;

            text-shadow:
                0 0 2px rgba(255,255,255,0.9),
                0 0 6px rgba(255,255,255,0.35);
        }

        #introInstruction.visible {
            opacity: 1;
            pointer-events: auto;
            cursor: url("assets/heart.png"), pointer;
        }

        #timeline {
            position: relative;

            width: max-content;
            min-height: 100vh;

            background: black;

            opacity: 0;
            transition: opacity 2.2s ease;
        }

        #timeline.visible {
            opacity: 1;
        }

        .timeline-image {
            display: block;

            height: 100vh;
            width: auto;
            max-width: none;

            user-select: none;
            -webkit-user-drag: none;
        }

        #instructions {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 40;

            transform: translateX(-50%);

            padding: 8px 12px;

            color: white;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid #777;

            font-family: "Determination", monospace;
            font-size: clamp(13px, 1.2vw, 18px);
            letter-spacing: 0.15em;
            white-space: nowrap;

            pointer-events: none;

            opacity: 0;
            transition: opacity 1s ease;
        }

        #instructions.visible {
            opacity: 1;
        }

        #instructions.hidden {
            opacity: 0;
        }

        #endShadow {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 80;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            width: min(62vw, 1050px);
            padding: 5vw;

            background:
                linear-gradient(
                    to right,
                    transparent 0%,
                    rgba(0, 0, 0, 0.46) 22%,
                    rgba(0, 0, 0, 0.88) 58%,
                    black 100%
                );

            opacity: 0;
            pointer-events: none;

            transition: opacity 1.4s ease;
        }

        #endShadow.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #endPrompt {
            position: relative;

            width: min(620px, 48vw);

            color: white;
            font-family: "EramFont", monospace;
            font-size: clamp(32px, 4vw, 62px);
            line-height: 1.45;
            letter-spacing: 0.13em;
            text-align: left;

            cursor: url("assets/heart.png"), pointer;

            text-shadow:
                -2px 0 rgba(255, 40, 40, 0.65),
                2px 0 rgba(0, 220, 255, 0.65),
                0 0 7px rgba(255,255,255,0.35);

            opacity: 0;
            transform: translateX(36px);

            transition:
                opacity 1.1s ease,
                transform 1.1s ease;
        }

        #endShadow.visible #endPrompt {
            opacity: 1;
            transform: translateX(0);
        }

        #exitFade {
            position: fixed;
            inset: 0;
            z-index: 900;

            background: black;

            opacity: 0;
            pointer-events: none;

            transition: opacity 2s ease;
        }

        #exitFade.active {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 700px) {
            #endShadow {
                width: 88vw;
                padding: 8vw;
            }

            #endPrompt {
                width: 72vw;
                font-size: clamp(26px, 7vw, 42px);
            }

            #introInstruction {
                white-space: normal;
                width: 86vw;
            }
        }

        .timeline-frame {
            position: relative;
            display: inline-block;
            height: 100vh;
        }

        .timeline-frame .timeline-image {
            position: relative;
            z-index: 1;
        }
        #crtOverlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,0) 56%,
                    rgba(0,0,0,0.12) 82%,
                    rgba(0,0,0,0.30) 100%
                ),
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.018) 0,
                    rgba(255,255,255,0.018) 1px,
                    rgba(0,0,0,0.10) 2px,
                    rgba(0,0,0,0.10) 4px
                );

            opacity: 0.72;
        }

        #crtOverlay::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(255,0,0,0.018),
                    rgba(0,255,255,0.012),
                    rgba(0,0,255,0.018)
                );

            mix-blend-mode: screen;
            opacity: 0.55;
        }
        #timelineFountain {
            position: absolute;
            left: 33%;
            transform: translateX(70px);
            top: -1%;
            z-index: 3;

            width: 34%;
            height: 101%;

            object-fit: contain;
            object-position: center;

            opacity: 0.33;

            filter:
                brightness(0.58)
                contrast(1.14)
                saturate(0.82);

            mix-blend-mode: screen;

            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        #resourcePanel {
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 300;

            width: clamp(360px, 27vw, 520px);
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding:
                clamp(28px, 4vh, 58px)
                clamp(28px, 3vw, 64px);

            background:
                linear-gradient(
                    to right,
                    rgba(0,0,0,1) 0%,
                    rgba(0,0,0,0.98) 45%,
                    rgba(0,0,0,0.84) 66%,
                    rgba(0,0,0,0.54) 82%,
                    rgba(0,0,0,0.20) 94%,
                    rgba(0,0,0,0) 100%
                );

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.55s ease,
                visibility 0s linear 0.55s;
        }

        #resourcePanel.hover-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transition:
                opacity 0.55s ease,
                visibility 0s linear 0s;
        }

        #resourceIntro {
            position: relative;

            display: grid;
            place-items: start;

            width: min(330px, 100%);
            min-height: 185px;

            margin-bottom: clamp(24px, 3.5vh, 44px);

            font-family: "EramFont", monospace;
            font-size: clamp(22px, 1.65vw, 32px);
            line-height: 1.7;
            letter-spacing: 0.09em;
            white-space: pre-wrap;

            animation:
                resourceIntroFlicker 0.18s infinite,
                resourceIntroJitter 4.4s steps(1,end) infinite;
        }

        .resourceIntroLayer {
            grid-area: 1 / 1;

            width: 100%;
            margin: 0;

            white-space: pre-wrap;
            pointer-events: none;
        }

        #resourceIntroRed {
            color: rgba(255,42,42,0.40);
            transform: translateX(-2px);
            z-index: 1;
        }

        #resourceIntroCyan {
            color: rgba(0,205,235,0.30);
            transform: translateX(2px);
            z-index: 2;
        }

        #resourceIntroWhite {
            color: rgba(238,238,238,0.90);
            z-index: 3;

            text-shadow:
                0 0 1px rgba(255,255,255,0.70),
                0 0 4px rgba(255,255,255,0.14);
        }

        #resourceLinks {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(13px, 1.7vh, 24px);

            pointer-events: auto;
        }

        .resource-link {
            display: inline-block;

            font-family: "VCR OSD Mono", monospace;
            font-size: clamp(21px, 1.75vw, 34px);
            line-height: 1.35;
            letter-spacing: 0.05em;

            text-decoration: none;

            text-shadow:
                -1px 0 rgba(255,0,60,0.34),
                 1px 0 rgba(0,220,255,0.28),
                 0 0 4px currentColor;

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .resource-link:hover,
        .resource-link:focus-visible {
            transform: translateX(10px);
            filter: brightness(1.32);
            outline: none;
        }

        .resource-earthbound {
            color: #ff4242;
        }

        .resource-halloween {
            color: #ff8800;
        }

        .resource-radiation {
            color: #ffe600;
        }

        .resource-homestuck {
            color: #39ff38;
        }

        .resource-hussie {
            color: #14baff;
        }

        .resource-kickstarter {
            color: #c83cff;
        }

        #resourceHoverTrigger {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 299;

            width: 54px;
            height: 100vh;

            background: transparent;
            pointer-events: auto;
        }

        @keyframes resourceIntroFlicker {
            0%, 100% { filter: brightness(1); }
            32% { filter: brightness(0.93); }
            68% { filter: brightness(0.98); }
        }

        @keyframes resourceIntroJitter {
            0%, 95%, 100% { transform: translate(0,0); }
            96% { transform: translate(-1px,0); }
            97% { transform: translate(1px,0); }
            98% { transform: translate(0,1px); }
            99% { transform: translate(-1px,0); }
        }

        @media (max-width: 900px) {
            #resourcePanel {
                width: min(78vw, 380px);
            }

            #resourceIntro {
                font-size: clamp(19px, 5vw, 28px);
            }

            .resource-link {
                font-size: clamp(18px, 5vw, 27px);
            }
        }
</style>
</head>

<body>

    <div id="resourceHoverTrigger" aria-hidden="true"></div>

    <aside id="resourcePanel" aria-label="Timeline reference links">

        <div id="resourceIntro" aria-hidden="true">
            <p id="resourceIntroRed" class="resourceIntroLayer">Don't know some
of these?

Hilarious...</p>

            <p id="resourceIntroCyan" class="resourceIntroLayer">Don't know some
of these?

Hilarious...</p>

            <p id="resourceIntroWhite" class="resourceIntroLayer">Don't know some
of these?

Hilarious...</p>
        </div>

        <nav id="resourceLinks">
            <a
                class="resource-link resource-earthbound"
                href="https://en.wikipedia.org/wiki/EarthBound"
                target="_blank"
                rel="noopener noreferrer"
            >EarthBound</a>

            <a
                class="resource-link resource-halloween"
                href="https://en.wikipedia.org/wiki/EarthBound_Halloween_Hack"
                target="_blank"
                rel="noopener noreferrer"
            >EarthBound<br>Halloween Hack</a>

            <a
                class="resource-link resource-radiation"
                href="https://www.reddit.com/r/CuratedTumblr/comments/10htls5/toby_fox_vs_radiation/#lightbox"
                target="_blank"
                rel="noopener noreferrer"
            >“Radiation”</a>

            <a
                class="resource-link resource-homestuck"
                href="https://en.wikipedia.org/wiki/Homestuck"
                target="_blank"
                rel="noopener noreferrer"
            >Homestuck</a>

            <a
                class="resource-link resource-hussie"
                href="https://en.wikipedia.org/wiki/Andrew_Hussie"
                target="_blank"
                rel="noopener noreferrer"
            >Andrew Hussie</a>

            <a
                class="resource-link resource-kickstarter"
                href="https://www.kickstarter.com/projects/1002143342/undertale"
                target="_blank"
                rel="noopener noreferrer"
            >Kickstarter</a>
        </nav>

    </aside>

    <div id="introSequence">

        <div id="introEram">
            <span id="introRed" class="intro-layer"></span>
            <span id="introCyan" class="intro-layer"></span>
            <span id="introWhite" class="intro-layer"></span>
        </div>

        <div id="introInstruction">
            CLICK TO CONTINUE
        </div>

    </div>

    <main id="timeline">
        <div class="timeline-frame">
            <img
                id="timelineFountain"
                src="assets/darkfountain.gif"
                alt=""
                draggable="false"
                aria-hidden="true"
            >

            <img
                class="timeline-image"
                src="assets/timeline/undertaletimelinefordagif-v2.png?v=20260803-1"
                alt="Undertale and Deltarune development timeline"
                draggable="false"
            >
        </div>
    </main>

    <div id="instructions">
        SCROLL OR DRAG TO CONTINUE
    </div>

    <div id="endShadow">
        <div id="endPrompt">
            Done?<br><br>
            I am.<br><br>
            Click here so we can leave.
        </div>
    </div>

    <div id="exitFade"></div>

    <audio id="timelineMusic" preload="auto" loop>
        <source src="assets/music/beforethestory.mp3" type="audio/mpeg">
    </audio>

    <audio id="selectSound" preload="auto">
        <source src="assets/sounds/select.wav" type="audio/wav">
    </audio>

    <audio id="eramTalkSound" preload="auto">
        <source src="assets/sounds/eram-talking.wav" type="audio/wav">
    </audio>

    <script>
const introSequence = document.getElementById("introSequence");

const introEram = document.getElementById("introEram");

const introRed = document.getElementById("introRed");

const introCyan = document.getElementById("introCyan");

const introWhite = document.getElementById("introWhite");

const introInstruction = document.getElementById("introInstruction");

const resourcePanel = document.getElementById("resourcePanel");

const resourceHoverTrigger = document.getElementById("resourceHoverTrigger");

const timeline = document.getElementById("timeline");

const instructions = document.getElementById("instructions");

const endShadow = document.getElementById("endShadow");

const endPrompt = document.getElementById("endPrompt");

const exitFade = document.getElementById("exitFade");

const timelineMusic = document.getElementById("timelineMusic");

const selectSound = document.getElementById("selectSound");

const eramTalkSound = document.getElementById("eramTalkSound");

let timelineReady = false;

let introReadyForClick = false;

let reachedTimelineEnd = false;

let leavingPage = false;

let isDragging = false;

let dragStartX = 0;

let scrollStartX = 0;

function safelyPlay(audio, volume = 1, restart = true) {
    if (!audio) return;
    audio.volume = volume;
    if (restart) audio.currentTime = 0;
    const attempt = audio.play();
    if (attempt !== void 0) attempt.catch(() => {});
}

function fadeAudio(audio, targetVolume, duration, pauseWhenDone = false) {
    if (!audio) return;
    if (audio._fadeTimer) clearInterval(audio._fadeTimer);
    const startVolume = audio.volume;
    const difference = targetVolume - startVolume;
    const startedAt = performance.now();
    audio._fadeTimer = setInterval(() => {
        const elapsed = performance.now() - startedAt;
        const progress = Math.min(elapsed / duration, 1);
        audio.volume = Math.max(0, Math.min(1, startVolume + difference * progress));
        if (progress >= 1) {
            clearInterval(audio._fadeTimer);
            audio._fadeTimer = null;
            if (pauseWhenDone && targetVolume === 0) {
                audio.pause();
                audio.currentTime = 0;
            }
        }
    }, 40);
}

function playEramCharacterSound(character) {
    if (character === " " || character === "\n") return;
    safelyPlay(eramTalkSound, 0.45);
}

function updateIntroText(text) {
    introRed.textContent = text;
    introCyan.textContent = text;
    introWhite.textContent = text;
}

function typeIntroLine() {
    const text = "Take a look!";
    let index = 0;
    updateIntroText("");
    function typeNextCharacter() {
        if (index >= text.length) {
            setTimeout(() => {
                introEram.classList.add("hidden");
                setTimeout(() => {
                    introInstruction.classList.add("visible");
                    introReadyForClick = true;
                }, 900);
            }, 900);
            return;
        }
        const character = text[index];
        updateIntroText(text.slice(0, index + 1));
        playEramCharacterSound(character);
        index++;
        setTimeout(typeNextCharacter, 105);
    }
    setTimeout(typeNextCharacter, 650);
}

function acceptIntro() {
    if (!introReadyForClick || timelineReady) return;
    introReadyForClick = false;
    safelyPlay(selectSound, 0.85);
    introInstruction.classList.remove("visible");
    setTimeout(beginTimeline, 450);
}

function beginTimeline() {
    timelineReady = true;
    document.body.classList.add("timeline-active");
    introSequence.classList.add("hidden");
    timeline.classList.add("visible");
    instructions.classList.add("visible");
    timelineMusic.pause();
    timelineMusic.currentTime = 0;
    timelineMusic.volume = 0;
    const attempt = timelineMusic.play();
    if (attempt !== void 0) attempt.then(() => {
        fadeAudio(timelineMusic, 0.52, 9000);
    }).catch(() => {});
    setTimeout(() => {
        introSequence.style.display = "none";
    }, 1900);
}

function hideInstructions() {
    instructions.classList.add("hidden");
}

function checkTimelineEnd() {
    if (!timelineReady) return;
    const maximumScroll = document.documentElement.scrollWidth - window.innerWidth;
    if (window.scrollX >= maximumScroll - 40) {
        reachedTimelineEnd = true;
        endShadow.classList.add("visible");
    } else {
        reachedTimelineEnd = false;
        endShadow.classList.remove("visible");
    }
}

function continueToPage3() {
    if (!reachedTimelineEnd || leavingPage) return;
    leavingPage = true;
    safelyPlay(selectSound, 0.85);
    endShadow.classList.remove("visible");
    exitFade.classList.add("active");
    fadeAudio(timelineMusic, 0, 1800, true);
    setTimeout(() => {
        window.location.href = "page3.html";
    }, 2000);
}

introInstruction.addEventListener("click", event => {
    event.stopPropagation();
    acceptIntro();
});

window.addEventListener("load", () => {
    selectSound.load();
    timelineMusic.load();
    eramTalkSound.load();
    typeIntroLine();
});

window.addEventListener("wheel", event => {
    if (!timelineReady) return;
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        window.scrollBy({
            left: event.deltaY,
            behavior: "auto"
        });
    }
    hideInstructions();
}, {
    passive: false
});

window.addEventListener("mousedown", event => {
    if (!timelineReady || event.button !== 0 || event.target.closest("#endPrompt") || event.target.closest("#resourcePanel") || event.target.closest("#resourceHoverTrigger")) return;
    isDragging = true;
    dragStartX = event.clientX;
    scrollStartX = window.scrollX;
    document.body.classList.add("dragging");
    hideInstructions();
});

window.addEventListener("mousemove", event => {
    if (!isDragging) return;
    const distance = event.clientX - dragStartX;
    window.scrollTo(scrollStartX - distance, 0);
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    document.body.classList.remove("dragging");
});

window.addEventListener("blur", () => {
    isDragging = false;
    document.body.classList.remove("dragging");
});

document.addEventListener("keydown", event => {
    if (!timelineReady) return;
    const movementAmount = Math.max(window.innerWidth * 0.75, 500);
    if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") {
        event.preventDefault();
        window.scrollBy({
            left: movementAmount,
            behavior: "smooth"
        });
        hideInstructions();
    }
    if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") {
        event.preventDefault();
        window.scrollBy({
            left: -movementAmount,
            behavior: "smooth"
        });
        hideInstructions();
    }
    if (event.key === "Enter" || event.key === "z" || event.key === "Z") continueToPage3();
});

window.addEventListener("scroll", () => {
    hideInstructions();
    checkTimelineEnd();
}, {
    passive: true
});

window.addEventListener("touchstart", hideInstructions, {
    passive: true
});

let resourceHideTimer = null;

function showResourcePanel() {
    if (resourceHideTimer) {
        clearTimeout(resourceHideTimer);
        resourceHideTimer = null;
    }
    resourcePanel.classList.add("hover-visible");
}

function scheduleResourcePanelHide() {
    if (resourceHideTimer) clearTimeout(resourceHideTimer);
    resourceHideTimer = setTimeout(() => {
        resourcePanel.classList.remove("hover-visible");
    }, 180);
}

resourceHoverTrigger.addEventListener("mouseenter", showResourcePanel);

resourcePanel.addEventListener("mouseenter", showResourcePanel);

resourcePanel.addEventListener("mouseleave", scheduleResourcePanelHide);

resourceHoverTrigger.addEventListener("mouseleave", event => {
    if (event.relatedTarget && resourcePanel.contains(event.relatedTarget)) return;
    scheduleResourcePanelHide();
});

document.querySelectorAll(".resource-link").forEach(link => {
    link.addEventListener("click", () => {
        safelyPlay(selectSound, 0.82);
    });
});

endPrompt.addEventListener("click", continueToPage3);
</script>

    <div id="crtOverlay" aria-hidden="true"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OPEN THE DOORS</title>

    <style>
@font-face {
            font-family: "VCR OSD Mono";
            src: url("assets/VCR_OSD_MONO.ttf") format("truetype");
            font-display: swap;
        }

        @font-face {
            font-family: "EramFont";
            src: url("assets/Final_Fantasy_I_-_NES.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: black;
        }

        body {
            cursor: url("assets/heart.png"), auto;
            user-select: none;
        }

        #introScreen {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;

            background: black;

            opacity: 1;
            transition: opacity 1.8s ease;
        }

        #introScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #introDialogue {
            position: relative;

            display: grid;
            place-items: center;

            width: min(940px, 88vw);
            min-height: 190px;

            font-family: "EramFont", monospace;
            font-size: clamp(34px, 3.2vw, 50px);
            line-height: 1.65;
            letter-spacing: 0.11em;
            text-align: center;
            white-space: pre-wrap;

            opacity: 1;
            transition: opacity 1.1s ease;

            animation:
                introFlicker 0.18s infinite,
                introJitter 4.4s steps(1, end) infinite;
        }

        #introDialogue.hidden {
            opacity: 0;
            animation: none;
        }

        .introLayer {
            grid-area: 1 / 1;

            width: 100%;
            margin: 0;

            text-align: center;
            white-space: pre-wrap;

            pointer-events: none;
        }

        #introRed {
            color: rgba(255, 42, 42, 0.40);
            transform: translateX(-2px);
            z-index: 1;
        }

        #introCyan {
            color: rgba(0, 205, 235, 0.30);
            transform: translateX(2px);
            z-index: 2;
        }

        #introWhite {
            color: rgba(236, 236, 236, 0.87);
            z-index: 3;

            text-shadow:
                0 0 1px rgba(255,255,255,0.70),
                0 0 3px rgba(255,255,255,0.12);
        }

        #introScreen::after {
            content: "";

            position: absolute;
            inset: 0;
            z-index: 20;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 2px,
                    rgba(255, 255, 255, 0.025) 3px,
                    rgba(0, 0, 0, 0.10) 4px
                );

            opacity: 0.38;

            animation: scanlineDrift 8s linear infinite;
        }

        #page {
            position: relative;

            display: block;

            width: max-content;
            min-height: 100vh;

            background: black;

            opacity: 0;
            pointer-events: none;

            transition: opacity 2.2s ease;
        }

        #page.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #doorContainer {
            position: relative;

            width: max-content;
            height: 100vh;
        }

        #doorScreen {
            display: block;

            width: 100vw;
            height: 100vh;
            max-width: none;

            object-fit: cover;
            object-position: center;

            user-select: none;
            -webkit-user-drag: none;
        }

        .door-link {
            position: absolute;
            z-index: 10;

            top: 28.5%;
            height: 18%;

            cursor: url("assets/heart.png"), pointer;
        }

        .door-1 {
            left: 0%;
            width: 7.2%;
        }

        .door-2 {
            left: 18.8%;
            width: 7%;
        }

        .door-3 {
            left: 37.4%;
            width: 7%;
        }

        .door-4 {
            left: 56.8%;
            width: 7%;
        }

        .door-5 {
            left: 75.1%;
            width: 7%;
        }

        .door-6 {
            left: 93%;
            width: 7%;
        }
        #continueZone {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 140;

            width: min(76vw, 1900px);
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            padding:
                80px
                clamp(72px, 5vw, 130px)
                80px
                clamp(480px, 35vw, 900px);

            background:
                linear-gradient(
                    to right,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,0.04) 8%,
                    rgba(0,0,0,0.11) 16%,
                    rgba(0,0,0,0.24) 27%,
                    rgba(0,0,0,0.43) 39%,
                    rgba(0,0,0,0.63) 52%,
                    rgba(0,0,0,0.79) 65%,
                    rgba(0,0,0,0.90) 77%,
                    rgba(0,0,0,0.97) 88%,
                    rgb(0,0,0) 100%
                );

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            cursor: url("assets/heart.png"), pointer;

            transition:
                opacity 0.55s ease,
                visibility 0s linear 0.55s;

            overflow: hidden;
        }

        #page.visible #continueZone.hover-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transition:
                opacity 0.55s ease,
                visibility 0s linear 0s;
        }

        #continueZone::before {
            content: "";

            position: absolute;
            inset: 0;
            z-index: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    to right,
                    transparent 0%,
                    rgba(0,0,0,0.02) 28%,
                    rgba(0,0,0,0.10) 43%,
                    rgba(0,0,0,0.29) 58%,
                    rgba(0,0,0,0.56) 73%,
                    rgba(0,0,0,0.82) 87%,
                    rgb(0,0,0) 100%
                );
        }

        #continueZone::after {
            content: "";

            position: absolute;
            inset: 0;
            z-index: 1;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 2px,
                    rgba(255,255,255,0.02) 3px,
                    rgba(0,0,0,0.10) 4px
                );

            opacity: 0.32;
        }

        #continueDialogue {
            position: relative;
            z-index: 2;

            display: grid;
            place-items: center;

            width: min(370px, 100%);

            font-family: "EramFont", monospace;
            font-size: clamp(26px, 1.7vw, 38px);
            line-height: 1.75;
            letter-spacing: 0.09em;
            text-align: center;
            white-space: pre-wrap;

            animation:
                introFlicker 0.18s infinite,
                introJitter 4.4s steps(1, end) infinite;
        }

        .continueLayer {
            grid-area: 1 / 1;

            width: 100%;
            margin: 0;

            text-align: center;
            white-space: pre-wrap;
            overflow: visible;

            pointer-events: none;
        }

        #continueRed {
            color: rgba(255, 42, 42, 0.40);
            transform: translateX(-2px);
            z-index: 1;
        }

        #continueCyan {
            color: rgba(0, 205, 235, 0.30);
            transform: translateX(2px);
            z-index: 2;
        }

        #continueWhite {
            color: rgba(236, 236, 236, 0.88);
            z-index: 3;

            text-shadow:
                0 0 1px rgba(255,255,255,0.70),
                0 0 3px rgba(255,255,255,0.12);
        }

        #continueZone:hover #continueDialogue {
            filter: brightness(1.12);
        }
        #continueHoverTrigger {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 139;

            width: 54px;
            height: 100vh;

            background: transparent;
            pointer-events: auto;
        }
        #continuePrompt {
            display: none !important;
        }

        #continuePrompt {
            position: fixed;
            left: 50%;
            bottom: 2.6%;
            z-index: 100;

            transform: translateX(-50%);

            padding: 12px 24px;

            color: white;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.22);

            font-family: "VCR OSD Mono", monospace;
            font-size: clamp(15px, 1.45vw, 22px);
            letter-spacing: 0.20em;
            line-height: 1.4;

            white-space: nowrap;

            text-shadow:
                -1px 0 rgba(255, 0, 60, 0.55),
                1px 0 rgba(0, 220, 255, 0.55),
                0 0 4px rgba(255, 255, 255, 0.45);

            animation:
                promptBlink 1.2s steps(1, end) infinite,
                promptJitter 4s steps(1, end) infinite;

            transition: opacity 0.6s ease;
        }

        #continuePrompt.hidden {
            opacity: 0;
        }

        #whiteExit {
            position: fixed;
            inset: 0;
            z-index: 2000;

            background: white;

            opacity: 0;
            pointer-events: none;

            transition: opacity 2s ease;
        }

        #whiteExit.active {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes introFlicker {
            0% {
                filter:
                    contrast(1.10)
                    brightness(1)
                    blur(0.18px);
            }

            25% {
                filter:
                    contrast(1.10)
                    brightness(0.95)
                    blur(0.18px);
            }

            55% {
                filter:
                    contrast(1.10)
                    brightness(0.99)
                    blur(0.18px);
            }

            75% {
                filter:
                    contrast(1.10)
                    brightness(0.92)
                    blur(0.18px);
            }

            100% {
                filter:
                    contrast(1.10)
                    brightness(1)
                    blur(0.18px);
            }
        }

        @keyframes introJitter {
            0%,
            95%,
            100% {
                transform: translate(0, 0);
            }

            96% {
                transform: translate(-1px, 0);
            }

            97% {
                transform: translate(1px, 0);
            }

            98% {
                transform: translate(0, 1px);
            }

            99% {
                transform: translate(-1px, 0);
            }
        }

        @keyframes scanlineDrift {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 4px;
            }
        }

        @keyframes promptBlink {
            0%,
            70% {
                opacity: 1;
            }

            71%,
            100% {
                opacity: 0.40;
            }
        }

        @keyframes promptJitter {
            0%,
            95%,
            100% {
                transform: translateX(-50%);
            }

            96% {
                transform: translateX(calc(-50% - 1px));
            }

            97% {
                transform: translateX(calc(-50% + 1px));
            }

            98% {
                transform: translateX(-50%);
            }
        }

        @media (max-width: 700px) {
            #continuePrompt {
                bottom: 2%;
                padding: 10px 16px;
                font-size: 13px;
                letter-spacing: 0.12em;
            }

            #introDialogue {
                width: 88vw;
                font-size: clamp(30px, 8vw, 48px);
            }
        }
        #crtOverlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,0) 56%,
                    rgba(0,0,0,0.12) 82%,
                    rgba(0,0,0,0.30) 100%
                ),
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.018) 0,
                    rgba(255,255,255,0.018) 1px,
                    rgba(0,0,0,0.10) 2px,
                    rgba(0,0,0,0.10) 4px
                );

            opacity: 0.72;
        }

        #crtOverlay::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(255,0,0,0.018),
                    rgba(0,255,255,0.012),
                    rgba(0,0,255,0.018)
                );

            mix-blend-mode: screen;
            opacity: 0.55;
        }
</style>
</head>

<body>

    <div id="introScreen">
        <div id="introDialogue">
            <p id="introRed" class="introLayer"></p>
            <p id="introCyan" class="introLayer"></p>
            <p id="introWhite" class="introLayer"></p>
        </div>
    </div>

    <main id="page">
        <div id="doorContainer">

            <img
                id="doorScreen"
                src="assets/doors/pg38.png"
                alt="A row of doors"
                draggable="false"
            >

            <a
                class="door-link door-1"
                href="https://youtube.com/playlist?list=PLSTN1W5Lxv20&si=SOUjpsbG5yHuKkP0"
                target="_blank"
                aria-label="Open the first playlist"
            ></a>

            <a
                class="door-link door-2"
                href="https://youtube.com/playlist?list=PLAupdoBpEud8&si=s5YDms-nyuDoNrny"
                target="_blank"
                aria-label="Open the second playlist"
            ></a>

            <a
                class="door-link door-3"
                href="https://youtube.com/playlist?list=PLQKzaQiJUVas&si=LafZ3psh-kWylbjh"
                target="_blank"
                aria-label="Open the third playlist"
            ></a>

            <a
                class="door-link door-4"
                href="https://youtube.com/playlist?list=PLfvdBqCrc2Dg&si=JZhiYc4mACLIjRKV"
                target="_blank"
                aria-label="Open the fourth playlist"
            ></a>

            <a
                class="door-link door-5"
                href="https://youtube.com/playlist?list=PLafsBDiy6QiI&si=xAl0Pe5s1iuecXiZ"
                target="_blank"
                aria-label="Open the fifth playlist"
            ></a>

            <a
                class="door-link door-6"
                href="https://youtube.com/playlist?list=PLY8-NgWPYzT0&si=Ri0Yqbr9omtBfLB4"
                target="_blank"
                aria-label="Open the sixth playlist"
            ></a>

        </div>

        <div
            id="continueZone"
            role="button"
            tabindex="0"
            aria-label="Continue to the next page"
        >
            <div id="continueDialogue">
                <p id="continueRed" class="continueLayer"></p>
                <p id="continueCyan" class="continueLayer"></p>
                <p id="continueWhite" class="continueLayer"></p>
            </div>
        </div>

        <div id="continuePrompt">
            [ ENTER / Z ] CONTINUE
        </div>
    </main>

    <div
        id="continueHoverTrigger"
        aria-hidden="true"
    ></div>

    <div id="whiteExit"></div>

    <audio id="determinationMusic" preload="auto" loop>
        <source src="assets/music/determinationpt2.mp3" type="audio/mpeg">
    </audio>

    <audio id="eramTalkingSound" preload="auto">
        <source src="assets/sounds/eram-talking.wav" type="audio/wav">
    </audio>

    <audio id="eramFinishTalkingSound" preload="auto">
        <source src="assets/sounds/eram-finish-talking.wav" type="audio/wav">
    </audio>

    <audio id="selectSound" preload="auto">
        <source src="assets/sounds/select.wav" type="audio/wav">
    </audio>

    <audio id="cymbalSound" preload="auto">
        <source src="assets/sounds/title-buildup.ogg" type="audio/ogg">
    </audio>

    <script>
const introScreen = document.getElementById("introScreen");

const introDialogue = document.getElementById("introDialogue");

const introRed = document.getElementById("introRed");

const introCyan = document.getElementById("introCyan");

const introWhite = document.getElementById("introWhite");

const page = document.getElementById("page");

const continuePrompt = document.getElementById("continuePrompt");

const continueZone = document.getElementById("continueZone");

const continueHoverTrigger = document.getElementById("continueHoverTrigger");

const continueRed = document.getElementById("continueRed");

const continueCyan = document.getElementById("continueCyan");

const continueWhite = document.getElementById("continueWhite");

const whiteExit = document.getElementById("whiteExit");

const determinationMusic = document.getElementById("determinationMusic");

const eramTalkingSound = document.getElementById("eramTalkingSound");

const eramFinishTalkingSound = document.getElementById("eramFinishTalkingSound");

const selectSound = document.getElementById("selectSound");

const cymbalSound = document.getElementById("cymbalSound");

const introMessage = "Click on the doors\nto reveal what's left.";

const continueMessage = "Click here to continue.\n\nThere's still more to show.";

let leavingPage = false;

let pageReady = false;

let isDragging = false;

let dragStartX = 0;

let scrollStartX = 0;

function safelyPlay(audio, volume = 1, restart = true) {
    if (!audio) return;
    audio.volume = volume;
    if (restart) audio.currentTime = 0;
    const attempt = audio.play();
    if (attempt !== void 0) attempt.catch(() => {});
}

function fadeAudio(audio, targetVolume, duration, pauseWhenDone = false) {
    if (!audio) return;
    if (audio._fadeTimer) clearInterval(audio._fadeTimer);
    const startVolume = audio.volume;
    const difference = targetVolume - startVolume;
    const startedAt = performance.now();
    audio._fadeTimer = setInterval(() => {
        const elapsed = performance.now() - startedAt;
        const progress = Math.min(elapsed / duration, 1);
        audio.volume = Math.max(0, Math.min(1, startVolume + difference * progress));
        if (progress >= 1) {
            clearInterval(audio._fadeTimer);
            audio._fadeTimer = null;
            if (pauseWhenDone && targetVolume === 0) {
                audio.pause();
                audio.currentTime = 0;
            }
        }
    }, 40);
}

function updateIntroText(text) {
    introRed.textContent = text;
    introCyan.textContent = text;
    introWhite.textContent = text;
}

function playTalkingBleep(character) {
    if (character === " " || character === "\n") return;
    safelyPlay(eramTalkingSound, 0.55);
}

function startDeterminationMusic() {
    determinationMusic.pause();
    determinationMusic.currentTime = 0;
    determinationMusic.loop = true;
    determinationMusic.volume = 0;
    const attempt = determinationMusic.play();
    if (attempt !== void 0) attempt.then(() => {
        fadeAudio(determinationMusic, 0.52, 7000);
    }).catch(() => {});
}

function revealDoorPage() {
    introDialogue.classList.add("hidden");
    setTimeout(() => {
        startDeterminationMusic();
        introScreen.classList.add("hidden");
        page.classList.add("visible");
        pageReady = true;
        continueRed.textContent = continueMessage;
        continueCyan.textContent = continueMessage;
        continueWhite.textContent = continueMessage;
        setTimeout(() => {
            introScreen.style.display = "none";
        }, 1900);
    }, 1000);
}

function typeIntroMessage() {
    let index = 0;
    updateIntroText("");
    function typeNextCharacter() {
        if (index >= introMessage.length) {
            safelyPlay(eramFinishTalkingSound, 0.72);
            setTimeout(revealDoorPage, 1300);
            return;
        }
        const character = introMessage[index];
        updateIntroText(introMessage.slice(0, index + 1));
        playTalkingBleep(character);
        index++;
        setTimeout(typeNextCharacter, 70);
    }
    setTimeout(typeNextCharacter, 700);
}

function leaveForPage5() {
    if (!pageReady || leavingPage) return;
    leavingPage = true;
    safelyPlay(selectSound, 0.9);
    safelyPlay(cymbalSound, 0.85);
    continuePrompt.classList.add("hidden");
    fadeAudio(determinationMusic, 0, 1800, true);
    setTimeout(() => {
        whiteExit.classList.add("active");
    }, 250);
    setTimeout(() => {
        window.location.href = "page5.html";
    }, 2450);
}

window.addEventListener("wheel", event => {
    if (!pageReady) return;
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        window.scrollBy({
            left: event.deltaY,
            behavior: "auto"
        });
    }
}, {
    passive: false
});

window.addEventListener("mousedown", event => {
    if (!pageReady || event.button !== 0 || event.target.closest(".door-link") || event.target.closest("#continueZone")) return;
    isDragging = true;
    dragStartX = event.clientX;
    scrollStartX = window.scrollX;
});

window.addEventListener("mousemove", event => {
    if (!isDragging) return;
    window.scrollTo(scrollStartX - (event.clientX - dragStartX), 0);
});

window.addEventListener("mouseup", () => {
    isDragging = false;
});

window.addEventListener("load", () => {
    eramFinishTalkingSound.load();
    typeIntroMessage();
});

let continueHideTimer = null;

function showContinueZone() {
    if (!pageReady) return;
    if (continueHideTimer) {
        clearTimeout(continueHideTimer);
        continueHideTimer = null;
    }
    continueZone.classList.add("hover-visible");
}

function scheduleContinueZoneHide() {
    if (continueHideTimer) clearTimeout(continueHideTimer);
    continueHideTimer = setTimeout(() => {
        continueZone.classList.remove("hover-visible");
    }, 180);
}

continueHoverTrigger.addEventListener("mouseenter", showContinueZone);

continueZone.addEventListener("mouseenter", showContinueZone);

continueZone.addEventListener("mouseleave", scheduleContinueZoneHide);

continueHoverTrigger.addEventListener("mouseleave", event => {
    if (event.relatedTarget && continueZone.contains(event.relatedTarget)) return;
    scheduleContinueZoneHide();
});

continueZone.addEventListener("click", event => {
    event.stopPropagation();
    leaveForPage5();
});

continueZone.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " " || event.key === "z" || event.key === "Z") {
        event.preventDefault();
        leaveForPage5();
    }
});

document.querySelectorAll(".door-link").forEach(link => {
    link.addEventListener("click", () => {
        safelyPlay(selectSound, 0.85);
    });
});

document.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === "z" || event.key === "Z") {
        event.preventDefault();
        leaveForPage5();
    }
});
</script>

    <div id="crtOverlay" aria-hidden="true"></div>

</body>
</html>

    <script>
const screen = document.getElementById("screen");

const darkFountainBackground = document.getElementById("darkFountainBackground");

const fountainPrompt = document.getElementById("fountainPrompt");

const eramDialogue = document.getElementById("eramDialogue");

const eramRed = document.getElementById("eramRed");

const eramCyan = document.getElementById("eramCyan");

const eramWhite = document.getElementById("eramWhite");

const finalDoorScreen = document.getElementById("finalDoorScreen");

const finalDoorButton = document.getElementById("finalDoorButton");

const finalDoorStarField = document.getElementById("finalDoorStarField");

const finalDoorStarZones = [ document.getElementById("starZoneTop"), document.getElementById("starZoneLeft"), document.getElementById("starZoneCenterLeft"), document.getElementById("starZoneCenterRight"), document.getElementById("starZoneRight") ];

const doorFade = document.getElementById("doorFade");

const finalMessage = document.getElementById("finalMessage");

const finalRed = document.getElementById("finalRed");

const finalCyan = document.getElementById("finalCyan");

const finalWhite = document.getElementById("finalWhite");

const whiteExit = document.getElementById("whiteExit");

const legendMusic = document.getElementById("legendMusic");

const dtIntroNoise = document.getElementById("dtIntroNoise");

const eramTalkingSound = document.getElementById("eramTalkingSound");

const eramFinishTalkingSound = document.getElementById("eramFinishTalkingSound");

const selectSound = document.getElementById("selectSound");

const messages = [ "Well...That's it!\nYou've seen all you need to see.", "Lopati...\nAren't you excited?\nAren't you happy?", "Everyone believes in you.\nEven when they shouldn't.\nIsn't that just perfect?", "For a long time, monsters never saw the sun.\nAnd you gave them that opportunity.\nHow wonderful...", "But if you soar too close to the sun,\nall they see is the shadow cast from\nyour wings.", "Even angels need algorithms, Lopati.\nShow us the modus to your power.", "And fall into sea." ];

const finalLine = "The Legend of the Deltarune.";

let messageIndex = 0;

let characterIndex = 0;

let typingTimer = null;

let isTyping = false;

let isTransitioning = false;

let finalDoorActive = false;

let finalMessageActive = false;

let finalMessageFinished = false;

let leavingPage = false;

let isTimelineDragging = false;

let timelineDragStartX = 0;

let timelineScrollStartX = 0;

let legendStarted = false;

let musicStep = 0;

let experienceStarted = false;

const typingSpeed = 45;

const musicLevels = [ 0.16, 0.25, 0.34, 0.43, 0.52, 0.62, 0.74, 0.86, 1.00 ];

function buildFinalDoorStars() {
    if (!finalDoorStarField || finalDoorStarField.dataset.built === "true") return;
    finalDoorStarField.dataset.built = "true";
    const starGroups = [ {
        source: "assets/star1.png",
        count: window.innerWidth >= 2200 ? 18 : 13,
        minSize: 28,
        maxSize: 44,
        minOpacity: 0.62,
        maxOpacity: 0.92
    }, {
        source: "assets/star2.png",
        count: window.innerWidth >= 2200 ? 18 : 13,
        minSize: 14,
        maxSize: 22,
        minOpacity: 0.52,
        maxOpacity: 0.82
    }, {
        source: "assets/star3.png",
        count: window.innerWidth >= 2200 ? 28 : 21,
        minSize: 8,
        maxSize: 14,
        minOpacity: 0.42,
        maxOpacity: 0.72
    }, {
        source: "assets/star4.png",
        count: window.innerWidth >= 2200 ? 88 : 66,
        minSize: 3,
        maxSize: 8,
        minOpacity: 0.26,
        maxOpacity: 0.58
    } ];
    const zoneWeights = [ 0.18, 0.27, 0.14, 0.14, 0.27 ];
    function chooseZone() {
        const value = Math.random();
        let total = 0;
        for (let index = 0; index < zoneWeights.length; index++) {
            total += zoneWeights[index];
            if (value <= total) return finalDoorStarZones[index];
        }
        return finalDoorStarZones[finalDoorStarZones.length - 1];
    }
    starGroups.forEach(group => {
        for (let index = 0; index < group.count; index++) {
            const zone = chooseZone();
            if (!zone) continue;
            const star = document.createElement("img");
            star.className = "finalDoorStar";
            star.alt = "";
            star.draggable = false;
            star.src = group.source;
            const size = Math.random() * (group.maxSize - group.minSize) + group.minSize;
            const opacity = Math.random() * (group.maxOpacity - group.minOpacity) + group.minOpacity;
            const driftX = Math.random() * 24 - 12;
            const duration = Math.random() * 9 + 11;
            const pulse = Math.random() * 3.2 + 2.6;
            star.style.left = 3 + Math.random() * 91 + "%";
            star.style.top = 3 + Math.random() * 87 + "%";
            star.style.setProperty("--size", size.toFixed(1) + "px");
            star.style.setProperty("--opacity", opacity.toFixed(2));
            star.style.setProperty("--duration", duration.toFixed(2) + "s");
            star.style.setProperty("--pulse", pulse.toFixed(2) + "s");
            star.style.setProperty("--delay", (-Math.random() * duration).toFixed(2) + "s");
            star.style.setProperty("--pulse-delay", (-Math.random() * pulse).toFixed(2) + "s");
            star.style.setProperty("--drift-x", driftX.toFixed(1) + "px");
            star.style.setProperty("--scale", (Math.random() * 0.18 + 0.91).toFixed(2));
            zone.appendChild(star);
        }
    });
}

function safelyPlay(audio, volume = 1, restart = true) {
    if (!audio) return;
    audio.volume = volume;
    if (restart) audio.currentTime = 0;
    const attempt = audio.play();
    if (attempt !== void 0) attempt.catch(() => {});
}

function fadeAudio(audio, targetVolume, duration, pauseWhenDone = false) {
    if (!audio) return;
    if (audio._fadeTimer) clearInterval(audio._fadeTimer);
    const startVolume = audio.volume;
    const difference = targetVolume - startVolume;
    const startedAt = performance.now();
    audio._fadeTimer = setInterval(() => {
        const elapsed = performance.now() - startedAt;
        const progress = Math.min(elapsed / duration, 1);
        audio.volume = Math.max(0, Math.min(1, startVolume + difference * progress));
        if (progress >= 1) {
            clearInterval(audio._fadeTimer);
            audio._fadeTimer = null;
            if (pauseWhenDone && targetVolume === 0) {
                audio.pause();
                audio.currentTime = 0;
            }
        }
    }, 40);
}

function startLegendMusic() {
    if (legendStarted) return;
    legendStarted = true;
    legendMusic.pause();
    legendMusic.currentTime = 0;
    legendMusic.loop = true;
    legendMusic.volume = 0;
    const attempt = legendMusic.play();
    if (attempt !== void 0) attempt.then(() => {
        fadeAudio(legendMusic, musicLevels[0], 2200);
    }).catch(() => {
        legendStarted = false;
    });
}

function ensureLegendMusic() {
    if (!legendStarted) startLegendMusic();
}

function increaseLegendVolume() {
    ensureLegendMusic();
    musicStep = Math.min(musicStep + 1, musicLevels.length - 1);
    fadeAudio(legendMusic, musicLevels[musicStep], 650);
}

function setLegendToFullVolume() {
    ensureLegendMusic();
    musicStep = musicLevels.length - 1;
    fadeAudio(legendMusic, 1, 1200);
}

function playTalkingBleep(character) {
    if (character === " " || character === "\n") return;
    safelyPlay(eramTalkingSound, 0.58);
}

function clearDialogue() {
    eramRed.textContent = "";
    eramCyan.textContent = "";
    eramWhite.textContent = "";
}

function addCharacter(character) {
    eramRed.textContent += character;
    eramCyan.textContent += character;
    eramWhite.textContent += character;
}

function showCompleteMessage() {
    clearTimeout(typingTimer);
    const message = messages[messageIndex];
    eramRed.textContent = message;
    eramCyan.textContent = message;
    eramWhite.textContent = message;
    characterIndex = message.length;
    isTyping = false;
    safelyPlay(eramFinishTalkingSound, 0.72);
}

function typeCurrentMessage() {
    clearTimeout(typingTimer);
    clearDialogue();
    eramDialogue.classList.remove("hidden");
    characterIndex = 0;
    isTyping = true;
    const message = messages[messageIndex];
    function typeNextCharacter() {
        if (characterIndex >= message.length) {
            isTyping = false;
            safelyPlay(eramFinishTalkingSound, 0.72);
            return;
        }
        const character = message[characterIndex];
        addCharacter(character);
        playTalkingBleep(character);
        characterIndex++;
        typingTimer = setTimeout(typeNextCharacter, typingSpeed);
    }
    typeNextCharacter();
}

function showFinalDoor() {
    finalDoorActive = true;
    setLegendToFullVolume();
    eramDialogue.classList.add("hidden");
    darkFountainBackground.classList.remove("visible");
    darkFountainBackground.classList.add("hidden");
    setTimeout(() => {
        eramDialogue.style.display = "none";
        darkFountainBackground.style.display = "none";
        finalDoorScreen.style.display = "flex";
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                finalDoorScreen.classList.add("visible");
            });
        });
    }, 1800);
}

function advanceDialogue() {
    if (isTransitioning || finalDoorActive || finalMessageActive || leavingPage) return;
    safelyPlay(selectSound, 0.85);
    increaseLegendVolume();
    if (isTyping) {
        showCompleteMessage();
        return;
    }
    isTransitioning = true;
    eramDialogue.classList.add("hidden");
    setTimeout(() => {
        messageIndex++;
        if (messageIndex >= messages.length) {
            isTransitioning = false;
            showFinalDoor();
            return;
        }
        typeCurrentMessage();
        isTransitioning = false;
    }, 650);
}

function openFinalDoor() {
    if (!finalDoorActive || leavingPage) return;
    finalDoorActive = false;
    safelyPlay(selectSound, 0.90);
    finalDoorScreen.classList.remove("visible");
    doorFade.classList.add("active");
    setTimeout(() => {
        finalDoorScreen.style.display = "none";
        finalMessageActive = true;
        typeFinalMessage(finalLine);
    }, 2200);
}

function typeFinalMessage(message) {
    finalRed.textContent = "";
    finalCyan.textContent = "";
    finalWhite.textContent = "";
    finalMessage.classList.add("visible");
    let index = 0;
    function typeNextCharacter() {
        if (index >= message.length) {
            finalMessageFinished = true;
            return;
        }
        const character = message[index];
        finalRed.textContent += character;
        finalCyan.textContent += character;
        finalWhite.textContent += character;
        playTalkingBleep(character);
        index++;
        setTimeout(typeNextCharacter, typingSpeed);
    }
    typeNextCharacter();
}

function leaveForPage6() {
    if (!finalMessageFinished || leavingPage) return;
    leavingPage = true;
    safelyPlay(selectSound, 0.90);
    safelyPlay(dtIntroNoise, 0.90);
    fadeAudio(legendMusic, 0, 2000, true);
    setTimeout(() => {
        whiteExit.classList.add("active");
    }, 150);
    setTimeout(() => {
        window.location.href = "page6.html";
    }, 2300);
}

window.addEventListener("load", () => {
    buildFinalDoorStars();
    eramTalkingSound.load();
    eramFinishTalkingSound.load();
    selectSound.load();
    legendMusic.load();
    dtIntroNoise.load();
    requestAnimationFrame(() => {
        screen.classList.add("visible");
        darkFountainBackground.classList.add("visible");
    });
});

function beginPage5Experience() {
    if (experienceStarted) return;
    experienceStarted = true;
    fountainPrompt.classList.add("hidden");
    darkFountainBackground.style.pointerEvents = "none";
    safelyPlay(selectSound, 0.85);
    startLegendMusic();
    eramTalkingSound.volume = 0;
    const unlockAttempt = eramTalkingSound.play();
    if (unlockAttempt !== void 0) unlockAttempt.then(() => {
        eramTalkingSound.pause();
        eramTalkingSound.currentTime = 0;
        eramTalkingSound.volume = 0.58;
    }).catch(() => {
        eramTalkingSound.volume = 0.58;
    });
    setTimeout(() => {
        typeCurrentMessage();
    }, 1200);
}

darkFountainBackground.addEventListener("click", event => {
    event.stopPropagation();
    beginPage5Experience();
});

window.addEventListener("wheel", event => {
    if (!finalDoorActive) return;
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        window.scrollBy({
            left: event.deltaY,
            behavior: "auto"
        });
    }
}, {
    passive: false
});

window.addEventListener("mousedown", event => {
    if (!finalDoorActive || event.button !== 0 || event.target === finalDoorButton) return;
    isTimelineDragging = true;
    timelineDragStartX = event.clientX;
    timelineScrollStartX = window.scrollX;
});

window.addEventListener("mousemove", event => {
    if (!isTimelineDragging) return;
    window.scrollTo(timelineScrollStartX - (event.clientX - timelineDragStartX), 0);
});

window.addEventListener("mouseup", () => {
    isTimelineDragging = false;
});

finalDoorButton.addEventListener("click", event => {
    event.stopPropagation();
    ensureLegendMusic();
    openFinalDoor();
});

document.addEventListener("click", () => {
    if (!experienceStarted) return;
    ensureLegendMusic();
    if (finalMessageActive && finalMessageFinished) {
        leaveForPage6();
        return;
    }
    advanceDialogue();
});

document.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== "z" && event.key !== "Z") return;
    event.preventDefault();
    if (!experienceStarted) {
        beginPage5Experience();
        return;
    }
    ensureLegendMusic();
    if (finalMessageActive && finalMessageFinished) {
        leaveForPage6();
        return;
    }
    advanceDialogue();
});
</script>

    <div id="crtOverlay" aria-hidden="true"></div>

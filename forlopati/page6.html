    opacity: 1;

}

}

            transform: translateX(-2px);

}

            opacity: 0.58;

        .snow {
            position: fixed;
            top: -40px;
            z-index: 50;
            width: var(--snow-size);
            height: var(--snow-size);
            object-fit: contain;
            image-rendering: pixelated;
            opacity: var(--snow-opacity);
            user-select: none;
            pointer-events: none;
            -webkit-user-drag: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            transition: opacity 6.5s ease;
        }

        .snow.ending {
            opacity: 0 !important;
        }

        @keyframes fall {
            from {
                transform: translate3d(0, 0, 0) rotate(0deg);
            }

            to {
                transform: translate3d(var(--snow-drift), calc(100vh + 100px), 0) rotate(180deg);
            }
        }

        .prophecyFall {
            position: fixed;
            top: -220px;
            z-index: 4;

            width: var(--prophecy-size);
            height: auto;

            object-fit: contain;
            image-rendering: pixelated;

            opacity: 0;

            filter:
                blur(var(--prophecy-blur))
                brightness(var(--prophecy-brightness))
                drop-shadow(
                    0 0 6px
                    rgba(70, 95, 255, 0.72)
                )
                drop-shadow(
                    0 0 18px
                    rgba(35, 55, 255, 0.48)
                );

            user-select: none;
            pointer-events: none;
            -webkit-user-drag: none;

            animation:
                prophecyFadeIn 1.15s ease forwards,
                prophecyFall var(--prophecy-duration)
                linear 1.15s forwards,
                prophecyGlow 2.2s ease-in-out
                1.15s infinite;

            transition:
                opacity 6.5s ease,
                filter 6.5s ease;
        }

        .prophecyFall.ending {
            opacity: 0 !important;

            filter:
                blur(calc(var(--prophecy-blur) + 5px))
                brightness(0.35)
                drop-shadow(
                    0 0 2px
                    rgba(55, 75, 255, 0.18)
                ) !important;
        }

        @keyframes prophecyFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: var(--prophecy-opacity);
            }
        }

        @keyframes prophecyFall {
            from {
                transform:
                    translate3d(0, -30px, 0)
                    rotate(var(--prophecy-start-rotation));
            }

            to {
                transform:
                    translate3d(
                        var(--prophecy-drift),
                        calc(100vh + 340px),
                        0
                    )
                    rotate(var(--prophecy-end-rotation));
            }
        }

        @keyframes prophecyGlow {
            0%,
            100% {
                filter:
                    blur(var(--prophecy-blur))
                    brightness(
                        var(--prophecy-brightness)
                    )
                    drop-shadow(
                        0 0 5px
                        rgba(70, 95, 255, 0.58)
                    )
                    drop-shadow(
                        0 0 14px
                        rgba(35, 55, 255, 0.36)
                    );
            }

            50% {
                filter:
                    blur(var(--prophecy-blur))
                    brightness(1.12)
                    drop-shadow(
                        0 0 10px
                        rgba(120, 145, 255, 0.92)
                    )
                    drop-shadow(
                        0 0 28px
                        rgba(55, 75, 255, 0.64)
                    );
            }
        }

        #audioError {

            left: 20px;
            bottom: 20px;
            z-index: 2000;

        #returnScreen {

            -webkit-user-drag: none;
            animation:

        @keyframes returnPulse {
            0%, 100% {

            50% {

            }
        }

            0%, 100% { transform: translateY(0); }

        @media (max-width: 600px) {
            #sectionContainer {
                width: 88vw;

            .tweet {
                padding-left: 12px;
            }

            #continuePrompt {
                right: 15px;
                bottom: 15px;
                font-size: 11px;
            }

            #connectionText {
                min-height: 170px;
            }
        }
</style>

    audio.volume = volume;
    if (restart) audio.currentTime = 0;
    const attempt = audio.play();
    if (attempt !== void 0) attempt.catch(() => {});
}

function playEramBleep(character) {
    if (character === " " || character === "\n") return;
    safelyPlay(eramTalkingSound, 0.58);
}

function playEramFinishSound() {
    safelyPlay(eramFinishTalkingSound, 0.72);
}

function updateConnectionText(text) {
    connectionRed.textContent = text;
    connectionCyan.textContent = text;
    connectionWhite.textContent = text;
}

function typeConnectionMessage() {
    updateConnectionText("");
    function typeNextCharacter() {
        if (connectionIndex >= connectionMessage.length) {
            playEramFinishSound();
            setTimeout(() => {
                startPrompt.classList.add("visible");
            }, 900);
            return;
        }
        const visibleText = connectionMessage.slice(0, connectionIndex + 1);
        updateConnectionText(visibleText);
        playEramBleep(connectionMessage[connectionIndex]);
        connectionIndex++;
        setTimeout(typeNextCharacter, connectionTypingSpeed);
    }
    typeNextCharacter();
}

function fadeMusicTo(targetVolume, duration, callback) {
    clearInterval(musicFadeTimer);
    const initialVolume = music.volume;
    const difference = targetVolume - initialVolume;
    const steps = 100;
    const interval = duration / steps;
    let currentStep = 0;
    musicFadeTimer = setInterval(() => {
        currentStep++;
        music.volume = Math.max(0, Math.min(1, initialVolume + difference * (currentStep / steps)));
        if (currentStep >= steps) {
            clearInterval(musicFadeTimer);
            music.volume = targetVolume;
            if (callback) callback();
        }
    }, interval);
}

function startExperience() {
    if (experienceStarted || !startPrompt.classList.contains("visible")) return;
    experienceStarted = true;
    safelyPlay(selectSound, 0.85);
    startPrompt.classList.remove("visible");
    backgroundLogo.classList.add("visible");
    backgroundLogo.classList.add("bright");
    logoOpener.classList.add("playing");
    connectionScreen.classList.add("hidden");
    page.classList.add("visible");
    music.volume = 0;
    const playAttempt = music.play();
    if (playAttempt !== void 0) playAttempt.then(() => fadeMusicTo(1, 14000)).catch(error => {
        audioError.style.display = "block";
    });
    setTimeout(() => {
        connectionScreen.style.display = "none";
        logoOpener.style.display = "none";
    }, 1800);
    setTimeout(() => {
        backgroundLogo.classList.remove("bright");
    }, 4500);
    setTimeout(() => {
        stage.classList.add("visible");
        beginSnow();
        beginProphecyRain();
        showSection(0);
    }, 5600);
}

function typeNarratorText(text) {
    clearTimeout(narratorTimer);
    sectionContainer.innerHTML = `\n<div class="eramDialogue">\n    <p class="eramDialogueLayer eramRed"></p>\n    <p class="eramDialogueLayer eramCyan"></p>\n    <p class="eramDialogueLayer eramWhite"></p>\n</div>\n`;
    const red = sectionContainer.querySelector(".eramRed");
    const cyan = sectionContainer.querySelector(".eramCyan");
    const white = sectionContainer.querySelector(".eramWhite");
    sectionTyping = true;
    sectionReady = false;
    let index = 0;
    function typeNextCharacter() {
        if (index >= text.length) {
            sectionTyping = false;
            playEramFinishSound();
            if (sectionIndex === 0 || sectionIndex === 1) {
                sectionReady = false;
                setTimeout(() => {
                    showSection(sectionIndex + 1);
                }, 1800);
            } else {
                sectionReady = true;
                continuePrompt.classList.add("visible");
            }
            return;
        }
        const visible = text.slice(0, index + 1);
        red.textContent = visible;
        cyan.textContent = visible;
        white.textContent = visible;
        const character = text[index];
        playEramBleep(character);
        index++;
        let delay = narratorTypingSpeed;
        if (character === "." || character === "!" || character === "?") delay = 300; else if (character === "," || character === ";") delay = 160;
        narratorTimer = setTimeout(typeNextCharacter, delay);
    }
    typeNextCharacter();
}

function typeStatementText(text) {
    clearTimeout(narratorTimer);
    sectionContainer.innerHTML = `\n        <div class="eramDialogue statementDialogue">\n            <p class="eramDialogueLayer eramRed"></p>\n            <p class="eramDialogueLayer eramCyan"></p>\n            <p class="eramDialogueLayer eramWhite"></p>\n        </div>\n    `;
    const red = sectionContainer.querySelector(".eramRed");
    const cyan = sectionContainer.querySelector(".eramCyan");
    const white = sectionContainer.querySelector(".eramWhite");
    sectionTyping = true;
    sectionReady = false;
    let index = 0;
    function typeNextCharacter() {
        if (index >= text.length) {
            sectionTyping = false;
            sectionReady = true;
            playEramFinishSound();
            continuePrompt.classList.add("visible");
            return;
        }
        const visible = text.slice(0, index + 1);
        red.textContent = visible;
        cyan.textContent = visible;
        white.textContent = visible;
        playEramBleep(text[index]);
        index++;
        narratorTimer = setTimeout(typeNextCharacter, narratorTypingSpeed);
    }
    typeNextCharacter();
}

function playEndingSequence(lines) {
    endingSequenceActive = true;
    sectionTyping = true;
    sectionReady = false;
    continuePrompt.classList.remove("visible");
    let lineIndex = 0;
    let lineFinished = false;
    function typeCurrentEndingLine() {
        const line = lines[lineIndex];
        sectionContainer.innerHTML = `\n            <div class="eramDialogue">\n                <p class="eramDialogueLayer eramRed"></p>\n                <p class="eramDialogueLayer eramCyan"></p>\n                <p class="eramDialogueLayer eramWhite"></p>\n            </div>\n        `;
        const red = sectionContainer.querySelector(".eramRed");
        const cyan = sectionContainer.querySelector(".eramCyan");
        const white = sectionContainer.querySelector(".eramWhite");
        red.textContent = "";
        cyan.textContent = "";
        white.textContent = "";
        sectionContainer.classList.remove("hidden");
        let characterIndex = 0;
        lineFinished = false;
        sectionTyping = true;
        sectionReady = false;
        function finishCurrentLine() {
            if (lineFinished) return;
            lineFinished = true;
            sectionTyping = false;
            sectionReady = true;
            playEramFinishSound();
            if (line.includes("Don't be afraid") && line.includes("This is gonna be great")) beginEnvironmentalFade();
            continuePrompt.classList.add("visible");
        }
        function typeNextCharacter() {
            if (characterIndex >= line.length) {
                finishCurrentLine();
                return;
            }
            const visible = line.slice(0, characterIndex + 1);
            red.textContent = visible;
            cyan.textContent = visible;
            white.textContent = visible;
            const character = line[characterIndex];
            playEramBleep(character);
            characterIndex++;
            let delay = narratorTypingSpeed;
            if (character === "." || character === "!" || character === "?") delay = 300; else if (character === "," || character === ";") delay = 160;
            narratorTimer = setTimeout(typeNextCharacter, delay);
        }
        archiveFinishImmediately = () => {
            if (lineFinished) return;
            clearTimeout(narratorTimer);
            red.textContent = line;
            cyan.textContent = line;
            white.textContent = line;
            finishCurrentLine();
        };
        typeNextCharacter();
    }
    window.advanceEndingLine = function() {
        if (!endingSequenceActive) return false;
        if (sectionTyping && archiveFinishImmediately) {
            archiveFinishImmediately();
            return true;
        }
        if (!sectionReady) return true;
        continuePrompt.classList.remove("visible");
        sectionReady = false;
        if (lineIndex >= lines.length - 1) {
            endingSequenceActive = false;
            archiveFinishImmediately = null;
            finishExperience();
            return true;
        }
        sectionContainer.classList.add("hidden");
        setTimeout(() => {
            lineIndex++;
            typeCurrentEndingLine();
        }, 700);
        return true;
    };
    typeCurrentEndingLine();
}

function showArchive(html) {
    clearTimeout(narratorTimer);
    archiveFinishImmediately = null;
    sectionContainer.innerHTML = html;
    const walker = document.createTreeWalker(sectionContainer, NodeFilter.SHOW_TEXT);
    const textEntries = [];
    let currentNode;
    while (currentNode = walker.nextNode()) {
        const cleanedText = currentNode.nodeValue.replace(/\s+/g, " ").trim();
        if (cleanedText.length > 0) {
            textEntries.push({
                node: currentNode,
                text: cleanedText
            });
            currentNode.nodeValue = "";
        }
    }
    sectionTyping = true;
    sectionReady = false;
    let entryIndex = 0;
    let characterIndex = 0;
    let archiveFinished = false;
    function finishArchive() {
        if (archiveFinished) return;
        archiveFinished = true;
        clearTimeout(narratorTimer);
        textEntries.forEach(entry => {
            entry.node.nodeValue = entry.text;
        });
        sectionTyping = false;
        sectionReady = true;
        archiveFinishImmediately = null;
        continuePrompt.classList.add("visible");
    }
    archiveFinishImmediately = finishArchive;
    function typeNextCharacter() {
        if (archiveFinished) return;
        if (entryIndex >= textEntries.length) {
            finishArchive();
            return;
        }
        const entry = textEntries[entryIndex];
        if (characterIndex >= entry.text.length) {
            entryIndex++;
            characterIndex = 0;
            narratorTimer = setTimeout(typeNextCharacter, 80);
            return;
        }
        entry.node.nodeValue += entry.text[characterIndex];
        characterIndex++;
        narratorTimer = setTimeout(typeNextCharacter, 14);
    }
    typeNextCharacter();
}

function showSection(index) {
    sectionIndex = index;
    sectionReady = false;
    continuePrompt.classList.remove("visible");
    sectionContainer.classList.add("hidden");
    setTimeout(() => {
        sectionViewport.scrollTop = 0;
        const section = sections[index];
        if (section.type === "narrator") typeNarratorText(section.text); else if (section.type === "statement") typeStatementText(section.text); else if (section.type === "endingSequence") playEndingSequence(section.lines); else showArchive(section.html);
        sectionContainer.classList.remove("hidden");
    }, 800);
}

function completeNarratorImmediately() {
    const section = sections[sectionIndex];
    if (!sectionTyping) return false;
    if (section.type !== "narrator" && section.type !== "statement") return false;
    clearTimeout(narratorTimer);
    const red = sectionContainer.querySelector(".eramRed");
    const cyan = sectionContainer.querySelector(".eramCyan");
    const white = sectionContainer.querySelector(".eramWhite");
    red.textContent = section.text;
    cyan.textContent = section.text;
    white.textContent = section.text;
    sectionTyping = false;
    sectionReady = true;
    continuePrompt.classList.add("visible");
    return true;
}

function advanceSection() {
    if (!experienceStarted || finalSequenceStarted) return;
    if (endingSequenceActive && typeof window.advanceEndingLine === "function") {
        window.advanceEndingLine();
        return;
    }
    if (sectionTyping) {
        const section = sections[sectionIndex];
        if (section.type === "archive" && archiveFinishImmediately) {
            archiveFinishImmediately();
            return;
        }
        completeNarratorImmediately();
        return;
    }
    if (!sectionReady) return;
    sectionReady = false;
    continuePrompt.classList.remove("visible");
    if (sectionIndex >= sections.length - 1) {
        finishExperience();
        return;
    }
    showSection(sectionIndex + 1);
}

function beginEnvironmentalFade() {
    if (snowInterval !== null) {
        clearInterval(snowInterval);
        snowInterval = null;
    }
    if (prophecyInterval !== null) {
        clearInterval(prophecyInterval);
        prophecyInterval = null;
    }
    document.querySelectorAll(".snow").forEach(snowflake => {
        snowflake.classList.add("ending");
    });
    document.querySelectorAll(".prophecyFall").forEach(symbol => {
        symbol.classList.add("ending");
    });
}

function finishExperience() {
    if (finalSequenceStarted) return;
    finalSequenceStarted = true;
    continuePrompt.classList.remove("visible");
    sectionContainer.classList.add("hidden");
    stage.classList.remove("visible");
    backgroundLogo.classList.add("ending");
    beginEnvironmentalFade();
    fadeMusicTo(0, 6000, () => {
        music.pause();
        music.currentTime = 0;
    });
    setTimeout(() => finalFade.classList.add("active"), 900);
    setTimeout(() => {
        returnScreenActive = true;
        returnScreen.classList.add("visible");
    }, 6800);
}

function createProphecySymbol() {
    if (finalSequenceStarted) return;
    const symbol = document.createElement("img");
    symbol.className = "prophecyFall";
    symbol.src = prophecyImages[Math.floor(Math.random() * prophecyImages.length)];
    symbol.alt = "";
    symbol.draggable = false;
    const size = Math.random() * 150 + 70;
    const opacity = Math.random() * 0.28 + 0.13;
    const duration = Math.random() * 8 + 7;
    const drift = Math.random() * 240 - 120;
    const startRotation = Math.random() * 20 - 10;
    const endRotation = startRotation + (Math.random() * 80 - 40);
    symbol.style.left = Math.random() * 96 - 3 + "vw";
    symbol.style.setProperty("--prophecy-size", size.toFixed(0) + "px");
    symbol.style.setProperty("--prophecy-opacity", opacity.toFixed(2));
    symbol.style.setProperty("--prophecy-duration", duration.toFixed(2) + "s");
    symbol.style.setProperty("--prophecy-drift", drift.toFixed(0) + "px");
    symbol.style.setProperty("--prophecy-start-rotation", startRotation.toFixed(1) + "deg");
    symbol.style.setProperty("--prophecy-end-rotation", endRotation.toFixed(1) + "deg");
    symbol.style.setProperty("--prophecy-brightness", (Math.random() * 0.28 + 0.55).toFixed(2));
    symbol.style.setProperty("--prophecy-blur", (Math.random() * 2.4 + 1.2).toFixed(1) + "px");
    document.body.appendChild(symbol);
    setTimeout(() => symbol.remove(), (duration + 1.5) * 1000);
}

function beginProphecyRain() {
    if (prophecyInterval !== null) return;
    for (let index = 0; index < 10; index++) setTimeout(createProphecySymbol, index * 120);
    prophecyInterval = setInterval(createProphecySymbol, 310);
}

function createSnowflake() {
    if (finalSequenceStarted) return;
    const snowflake = document.createElement("img");
    snowflake.className = "snow";
    snowflake.src = "assets/snowsprite.png";
    snowflake.alt = "";
    snowflake.draggable = false;
    snowflake.style.left = Math.random() * 100 + "vw";
    snowflake.style.setProperty("--snow-opacity", (Math.random() * 0.55 + 0.30).toFixed(2));
    snowflake.style.setProperty("--snow-size", (Math.random() * 18 + 10).toFixed(0) + "px");
    snowflake.style.setProperty("--snow-drift", (Math.random() * 80 - 40).toFixed(0) + "px");
    snowflake.style.animationDuration = (Math.random() * 3.5 + 3.5).toFixed(2) + "s";
    document.body.appendChild(snowflake);
    setTimeout(() => snowflake.remove(), 13000);
}

function beginSnow() {
    if (snowInterval !== null) return;
    snowInterval = setInterval(createSnowflake, 145);
}

document.addEventListener("click", event => {
    if (returnScreenActive) {
        if (event.target === returnSavePoint) {
            safelyPlay(selectSound, 0.90);
            setTimeout(() => {
                window.location.href = "index.html";
            }, 220);
        }
        return;
    }
    if (!openerStarted) {
        if (event.target !== openerLogo) return;
        openerStarted = true;
        safelyPlay(selectSound, 0.85);
        eramTalkingSound.volume = 0;
        const unlockAttempt = eramTalkingSound.play();
        if (unlockAttempt !== void 0) unlockAttempt.then(() => {
            eramTalkingSound.pause();
            eramTalkingSound.currentTime = 0;
            eramTalkingSound.volume = 0.58;
        }).catch(() => {
            eramTalkingSound.volume = 0.58;
        });
        logoOpener.classList.add("hidden");
        setTimeout(() => {
            typeConnectionMessage();
        }, 1800);
        return;
    }
    safelyPlay(selectSound, 0.80);
    if (!experienceStarted) {
        startExperience();
        return;
    }
    advanceSection();
});

document.addEventListener("keydown", event => {
    if (returnScreenActive) {
        if (/^[0-9]$/.test(event.key)) {
            secretCodeBuffer = (secretCodeBuffer + event.key).slice(-secretCode.length);
            if (secretCodeBuffer === secretCode) {
                safelyPlay(selectSound, 0.90);
                returnScreen.classList.remove("visible");
                setTimeout(() => {
                    window.location.href = "page7.html";
                }, 900);
            }
        }
        return;
    }
    if (event.key !== "Enter" && event.key !== "z" && event.key !== "Z") return;
    event.preventDefault();
    if (!openerStarted) return;
    safelyPlay(selectSound, 0.80);
    if (!experienceStarted) {
        startExperience();
        return;
    }
    advanceSection();
});

window.addEventListener("load", () => {
    eramTalkingSound.load();
    eramFinishTalkingSound.load();
    selectSound.load();
    music.load();
    page.classList.remove("visible");
});
</script>
